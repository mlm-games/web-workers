name: Audit

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    uses: mlm-games/ci/.github/workflows/rust-ci.yml@v1
    with:
      run-fmt: false
      run-clippy: false
      run-test: false
      run-audit: true